[package]
name = "vivid_gateway"
version = "1.5.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/vivido-dev/vivid_gateway"
description = "Reusable terminating Vivid 1.5 presenter and re-origination gateway"

[features]
# Test-support API for gateway consumers (vvmux) that drive the presenter from their own test
# suites. Off by default: it is only compiled into crates that ask for it, and it never affects a
# production build of the gateway.
testing = []

[dependencies]
getrandom = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
vivid_protocol = { version = "1.5", path = "../vivid_protocol" }
vivid_sdk = { version = "1.5", path = "../vivid_sdk" }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
vivid_sdk = { version = "1.5", path = "../vivid_sdk", features = ["testing"] }
