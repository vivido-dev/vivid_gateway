[package]
name = "vivid_gateway"
version = "1.5.12"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/vivido-dev/vivid_gateway"
description = "Vivid 1.5 re-origination gateway over the vivid_sdk presenter"
keywords = ["vivid", "gateway", "terminal", "media", "protocol"]
categories = ["network-programming", "multimedia"]

[features]
# Test-support API for gateway consumers (vvmux) that drive the presenter from their own test
# suites. Off by default: it is only compiled into crates that ask for it, and it never affects a
# production build of the gateway. The presenter half of that API now lives in `vivid_sdk`, so this
# forwards rather than gating anything locally.
testing = ["vivid_sdk/testing"]

[dependencies]
vivid_protocol = { version = "1.5", path = "../vivid_protocol" }
vivid_sdk = { version = "1.5", path = "../vivid_sdk", features = ["presenter"] }

[dev-dependencies]
tempfile = "3"
vivid_sdk = { version = "1.5", path = "../vivid_sdk", features = ["testing"] }

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
literal_string_with_formatting_args = "allow"
# The vivid_* crates and their dependencies pin overlapping versions this crate cannot unify.
multiple_crate_versions = "allow"
# Reconciliation passes are single ordered protocol transactions; their length is tracked, not
# linted, until each can be split without reordering outer requests.
too_many_lines = "allow"
